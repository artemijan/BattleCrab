# ---------------------------------------------------------------------------------------------------------------------------------
# Monitor Settings
# The per-server sampler behind the admin dashboard's monitoring section (docs/MONITORING.md).
#
# Every SampleSeconds a dedicated thread records one sample: wire traffic (packets/bytes in and out), connections, process CPU
# time, resident memory, and every other metric the server registers. Samples are kept in an in-memory ring and served over a
# loopback port; the dashboard polls that port and owns long-term storage. The server itself never writes them to disk.
# ---------------------------------------------------------------------------------------------------------------------------------

# Where the monitor channel listens. One request line in, newline-delimited JSON out, then the connection closes:
#
#   $ printf 'since 0\n' | nc 127.0.0.1 7780
#   {"service":"login_server","ts":1759000005000,"interval_ms":5000,"cpu_micros":8120,"rss_bytes":null,...,"metrics":{...}}
#
# There is deliberately no authentication. The security control is the bind address: on loopback the kernel will not
# route off-host traffic here at all. Widening InternalMonitorBindAddress publishes traffic volumes and process memory to
# anything that can reach the port — if you do it, put your own control in front.
#
# Set InternalMonitorPort = 0 to disable the channel AND the sampler.
# Default: 127.0.0.1 / 7780
InternalMonitorBindAddress = 127.0.0.1
InternalMonitorPort = 7780

# Sample period in seconds. Every stored series has this granularity, and samples are stamped on period boundaries so the
# game and login servers line up in the same buckets — keep it the same on both.
# Default: 5
SampleSeconds = 5

# How many samples the in-memory ring keeps. This is how long the dashboard can be away (a deploy, a restart) without
# leaving a gap in the charts. 720 x 5 s = 1 hour.
# Default: 720
RingSamples = 720
