# ---------------------------------------------------------------------------------------------------------------------------------
# Logging Settings
# Controls the diagnostic log pipeline: what is written, where it is written, how it rotates and how long it is kept.
# This replaces the Java server's log.cfg (java.util.logging).
#
# The login server is far lower volume than the game server, so the load-shedding knobs below rarely matter here;
# they are kept identical so both servers are configured the same way.
# ---------------------------------------------------------------------------------------------------------------------------------


# ---------------------------------------------------------------------------------------------------------------------------------
# Verbosity
# ---------------------------------------------------------------------------------------------------------------------------------

# Log level for the file layer.
# Accepts a comma-separated list of directives, so a noisy subsystem can be quietened without lowering the whole server:
#   Level = info,loginserver::network::client_connection=warn
# Valid levels: trace, debug, info, warn, error, off
# The RUST_LOG environment variable overrides this key entirely, which is the intended way to debug a running server
# without editing the datapack.
# Default: info
Level = info

# Log level for the console (stdout). Under systemd this is what reaches the journal, so it is kept separate from the
# file level: the file can be verbose while the journal stays readable.
# Default: info
ConsoleLevel = info

# Write to the console at all.
# Default: True
ConsoleEnable = True


# ---------------------------------------------------------------------------------------------------------------------------------
# Files
# ---------------------------------------------------------------------------------------------------------------------------------

# Write the rotating log file.
# Default: True
FileEnable = True

# Directory for log files, relative to the working directory the server was started in. Created at startup if missing.
# Default: log
Directory = log

# File format.
#   json  - one JSON object per line, carrying span fields as real fields. What a log shipper expects.
#   plain - human-readable text, for reading directly on the server with less/tail.
# Default: json
FileFormat = json

# Mirror WARN and ERROR into a second file (login_server_error.log).
# This file is deliberately never dropped and ignores the per-target directives in Level.
# Default: True
ErrorFileEnable = True


# ---------------------------------------------------------------------------------------------------------------------------------
# Rotation and retention
# ---------------------------------------------------------------------------------------------------------------------------------

# How often to start a new file. Rotation is time-based, not size-based (the Java server rotated at 100 MB).
# Valid values: daily, hourly, never
# Default: daily
Rotation = daily

# How many rotated files to keep. Older ones are deleted as new ones are created.
# With Rotation = daily, this is a retention window in days.
# 0 keeps every file forever - only sensible if something else prunes the directory.
# Default: 14
Retention = 14


# ---------------------------------------------------------------------------------------------------------------------------------
# Load shedding
# ---------------------------------------------------------------------------------------------------------------------------------

# Capacity of the buffer between the server threads and the log writer thread, in lines.
# When the buffer is full the line is DROPPED rather than blocking the caller.
# Default: 131072
BufferedLines = 131072

# How often, in seconds, to report lines lost to a full buffer (logged as a WARN).
# Dropping is otherwise invisible. 0 disables the report.
# Default: 60
DropReportSeconds = 60
