# ---------------------------------------------------------------------------------------------------------------------------------
# Logging Settings
# Controls the diagnostic log pipeline: what is written, where it is written, how it rotates and how long it is kept.
# This replaces the Java server's log.cfg (java.util.logging).
#
# These are DIAGNOSTIC logs. They are droppable by design: when the server is busy enough to fill the write buffer,
# lines are discarded rather than made to wait, so a load spike costs log detail instead of tick budget.
# Audit records (chat, GM commands, item transactions) must never be dropped and do not travel this pipeline.
# ---------------------------------------------------------------------------------------------------------------------------------


# ---------------------------------------------------------------------------------------------------------------------------------
# Verbosity
# ---------------------------------------------------------------------------------------------------------------------------------

# Log level for the file layer.
# Accepts a comma-separated list of directives, so a noisy subsystem can be quietened without lowering the whole server:
#   Level = info,gameserver::game_loop::net=warn,gameserver::network::connection=warn
# Valid levels: trace, debug, info, warn, error, off
# The RUST_LOG environment variable overrides this key entirely, which is the intended way to debug a running server
# without editing the datapack.
# NOTE: debug and trace lines still cost CPU to format even when a filter discards them. To remove that cost for good,
# build with `--features tracing/release_max_level_info`, which deletes them at compile time.
# Default: info
Level = info

# Log level for the console (stdout). Under systemd this is what reaches the journal, so it is kept separate from the
# file level: the file can be verbose while the journal stays readable.
# Default: info
ConsoleLevel = info

# Write to the console at all.
# Default: True
ConsoleEnable = True


# ---------------------------------------------------------------------------------------------------------------------------------
# Files
# ---------------------------------------------------------------------------------------------------------------------------------

# Write the rotating log file.
# Default: True
FileEnable = True

# Directory for log files, relative to the datapack root. Created at startup if missing.
# Default: log
Directory = log

# File format.
#   json  - one JSON object per line. Carries span fields (account, character, object id) as real fields, which is what
#           makes "what happened to this player" a single query rather than an archaeology session. Also what a log
#           shipper (Vector, Promtail) expects.
#   plain - human-readable text, for reading directly on the server with less/tail.
# Default: json
FileFormat = json

# Mirror WARN and ERROR into a second file (<service>_error.log).
# This file is deliberately never dropped and ignores the per-target directives in Level: incidents are rare, cheap to
# keep, and are the one thing that must survive a saturated buffer.
# Default: True
ErrorFileEnable = True


# ---------------------------------------------------------------------------------------------------------------------------------
# Rotation and retention
# ---------------------------------------------------------------------------------------------------------------------------------

# How often to start a new file. Rotation is time-based, not size-based (the Java server rotated at 100 MB).
# Valid values: daily, hourly, never
# Default: daily
Rotation = daily

# How many rotated files to keep. Older ones are deleted as new ones are created.
# With Rotation = daily, this is a retention window in days.
# 0 keeps every file forever - only sensible if something else prunes the directory.
# Default: 14
Retention = 14


# ---------------------------------------------------------------------------------------------------------------------------------
# Load shedding
# ---------------------------------------------------------------------------------------------------------------------------------

# Capacity of the buffer between the server threads and the log writer thread, in lines.
# The game thread never performs the write itself; it hands the finished line to this buffer. When the buffer is full
# the line is DROPPED rather than blocking the caller, which is the behaviour that keeps a logging burst from eating
# the tick budget.
# Raise it to tolerate longer write stalls at the cost of memory; lower it to bound memory during a burst.
# Default: 131072
BufferedLines = 131072

# How often, in seconds, to report lines lost to a full buffer (logged as a WARN).
# Dropping is otherwise invisible, which is the failure mode worth guarding against: without this the log looks calm
# during precisely the incident someone opened it to understand.
# 0 disables the report.
# Default: 60
DropReportSeconds = 60
