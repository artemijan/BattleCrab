# ---------------------------------------------------------------------------
# Security — transport-level flood protection
# ---------------------------------------------------------------------------
# This file has no L2J Mobius counterpart. FloodProtector.ini rate-limits
# *actions* for a logged-in client; these settings sit one layer lower and
# bound what a socket can do before (or without ever) logging in.
#
# All of it can be turned off, and the defaults are far above any legitimate
# client. If you turn something off here, FloodProtector.ini still applies.


# ---------------------------------------------------------------------------
# Per-IP connection limits, applied when a connection is accepted.
# ---------------------------------------------------------------------------
# These are the rules L2J Mobius applies to the game-server <-> login-server
# link (FloodProtectedListener), with its LoginServer.ini values, applied here
# to player connections as well.
#
# NOTE ON SHARED ADDRESSES: an internet cafe, a household, or any NAT is a
# single address. MaxConnectionsPerIP is generous for that reason, but
# FastConnectionTime is the setting to relax first if legitimate players are
# being turned away — it refuses *any* two connections from one address that
# arrive closer together than its value.

# Default: True
EnableConnectionFloodProtection = True

# Live connections allowed from one address.
# Default: 50
MaxConnectionsPerIP = 50

# Above this many live connections from one address, new ones must also be at
# least NormalConnectionTime apart.
# Default: 15
FastConnectionLimit = 15

# Milliseconds. Applies only past FastConnectionLimit.
# Default: 700
NormalConnectionTime = 700

# Milliseconds. Any two connections from one address closer together than this
# are refused outright. Set to 0 to disable just this rule.
# Default: 350
FastConnectionTime = 350


# ---------------------------------------------------------------------------
# Per-connection inbound packet rate.
# ---------------------------------------------------------------------------
# The game thread's inbound queue is unbounded, so without this one socket can
# put an unbounded amount of work in flight between two 100ms ticks. A busy
# client peaks in the low tens of packets per second; the default leaves an
# order of magnitude of headroom. Exceeding it closes the connection (dropping
# packets silently would desynchronise the client's view of its own requests).

# Default: True
EnablePacketRateLimit = True

# Default: 300
MaxPacketsPerSecond = 300


# ---------------------------------------------------------------------------
# Authentication deadline and automatic IP bans.
# ---------------------------------------------------------------------------
# A real client authenticates (AuthLogin, confirmed by the login server) within
# a second or two of connecting. A connection that has not done so within
# UnauthenticatedTimeout is dropped. If it never even sent its credentials, the
# drop is a strike against its address; UnauthenticatedStrikesBeforeBan strikes
# within UnauthenticatedStrikeWindow put the address on the IP ban list (the
# same list the dashboard's Audit page edits), which both servers refuse.
#
# A client that sent its credentials but is still waiting on a slow or
# unreachable login server is dropped without a strike: that is not its fault.

# Milliseconds. 0 disables the deadline and the strikes.
# Default: 5000
UnauthenticatedTimeout = 5000

# Strikes from one address that ban it. 0 drops but never bans.
# Default: 5
UnauthenticatedStrikesBeforeBan = 5

# Milliseconds. Only strikes this recent count.
# Default: 60000
UnauthenticatedStrikeWindow = 60000

# Minutes the automatic ban lasts. 0 is permanent (lift it on the Audit page).
# Default: 0
UnauthenticatedBanMinutes = 5
