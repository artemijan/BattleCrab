# ---------------------------------------------------------------------------
# Web Dashboard settings
#
# Every key here can be overridden by an environment variable. The variable
# name is derived from THIS FILE'S PATH, so the prefix is
# DIST_GAME_CONFIG_DASHBOARD_ followed by the uppercased key:
#
#   URL   ->  DIST_GAME_CONFIG_DASHBOARD_URL
#   Port  ->  DIST_GAME_CONFIG_DASHBOARD_PORT
#
# (Moving this file changes those variable names.)
#
# NOTE: nothing secret belongs in this file — it is committed to the
# repository. The session signing key is environment-only; see Sessions below.
#
# Design notes: docs/PLAN_DASHBOARD.md
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------

BindAddress = 0.0.0.0
Port = 8080

# Public origin the site is reached on. Used to build the links sent in emails,
# and — importantly — session cookies are only marked `Secure` when this is
# https://. Always set this to the real https URL in production.
PublicBaseUrl = http://localhost:8080

# Where the SPA is served from. Password-reset and email-verification links are
# built against this, because those are FRONTEND routes — pointing them at the
# API host hands the user a URL with no page behind it.
#
#   Production: https://battlecrab.com

SiteBaseUrl = https://battlecrab.com

# Browser origins allowed to call this API with credentials (comma-separated).
#
# The API is on its own subdomain (api.battlecrab.com), so every request from
# the site is cross-origin and CORS applies.
#
# Two entry forms:
#
#   battlecrab.com          a domain: matches that domain AND any subdomain,
#                           over HTTPS only. This is the production setting.
#   http://localhost:3000   an explicit origin, matched exactly.
#
# The domain form is a strict label match, not a string suffix: it accepts
# battlecrab.com, www.battlecrab.com and api.battlecrab.com, and refuses
# evilbattlecrab.com and battlecrab.com.evil.example. Plain http:// is refused
# for the domain form, because anyone able to intercept plaintext could
# otherwise present a trusted origin.
#
# Never a wildcard: browsers reject `Allow-Origin: *` whenever credentials are
# sent, and accepting arbitrary origins would let any website drive a
# logged-in user's account.
#
# Local dev needs nothing here — `bun run dev` proxies /api to this server, so
# the browser sees a single origin and CORS never applies.

AllowedOrigins = battlecrab.com

# ---------------------------------------------------------------------------
# Database
#
# MUST be the same SQLite file the login and game servers use — this is the
# integration point, and there is no sync layer. Pointing it at a stale copy
# will silently create accounts nobody can log in with.
#
# Copy the value from dist/login/config/LoginServer.ini verbatim.
# ---------------------------------------------------------------------------

URL = jdbc:sqlite:interlude_classic.db?journal_mode=WAL&busy_timeout=5000

MaximumDatabaseConnections = 5

# ---------------------------------------------------------------------------
# Sessions
#
# The session signing key is NOT configured here. It is read from the
# environment only:
#
#     DASHBOARD_SESSION_SECRET
#
# This file is committed to the repository, so a secret written here would be
# one `git add` away from living in git history forever, and would be copied to
# every clone and CI runner. The server refuses to start if the variable is
# unset or shorter than 32 characters, and logs an error if it finds a
# SessionSecret key in this file (which it ignores).
#
#   Generate:  openssl rand -hex 32
#
# It must stay stable across restarts — changing it invalidates every session
# and every outstanding password-reset link, which makes rotating it the
# deliberate "log everyone out" switch.
#
# deploy-dashboard.sh writes it to a chmod-600 env file on the server, loaded
# by the systemd unit via EnvironmentFile=.
# ---------------------------------------------------------------------------

SessionTtlDays = 7

# ---------------------------------------------------------------------------
# Registration
# ---------------------------------------------------------------------------

RegistrationEnabled = True

# Passwords are stored with the game's own hash (unsalted SHA-1), which the
# client requires and we cannot change. Length is therefore the main defence if
# the table ever leaks — do not lower this.
MinPasswordLength = 8
MaxPasswordLength = 45

MaxLoginLength = 45

# ---------------------------------------------------------------------------
# Email (Amazon SES)
#
# NOTHING IS CONFIGURED HERE. Every SMTP setting comes from the environment:
#
#     DASHBOARD_SMTP_HOST        (empty or unset disables sending)
#     DASHBOARD_SMTP_PORT        (default 587)
#     DASHBOARD_SMTP_FROM        (default BattleCrab <no-reply@battlecrab.com>)
#     DASHBOARD_SMTP_USERNAME
#     DASHBOARD_SMTP_PASSWORD
#
# The credentials have to live outside this file because it is committed. The
# host/port/from moved out too, after the deploy script's
# `sed "s|^SmtpHost.*|...|"` silently did nothing against a remote copy of this
# file that predated those keys — sed exits 0 when it matches nothing, so the
# deploy reported success while mail stayed disabled. A key that does not exist
# cannot be missed.
#
# Adding SmtpHost/SmtpPort/SmtpFrom back here will NOT work: the server ignores
# them and logs an error naming them at boot.
#
# With no DASHBOARD_SMTP_HOST set, links are written to the log instead of being
# sent, which is how local development works without an SES account.
#
# With SES these are *SES SMTP credentials* (SES console -> SMTP settings ->
# Create SMTP credentials), NOT your AWS access key pair. SES derives the SMTP
# password from a secret access key; pasting the access key itself fails to
# authenticate and is the most common setup mistake.
#
# Ports: 587 / 25 / 2587 use STARTTLS, 465 / 2465 are TLS from the first byte.
# The server picks the right mode from the port number. SES requires TLS on all
# of them.
#
# Note the endpoint is `email-smtp.`, not `smtp.`:
#     email-smtp.eu-west-1.amazonaws.com
#
# DASHBOARD_SMTP_FROM must be an identity verified in SES — this is required in production
# as well as in the sandbox. While the account is in the SES sandbox you can
# also only send TO verified addresses (200/day, 1/second), so request
# production access before opening registration to real players.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Rate limiting
#
# Load-bearing rather than decorative, for the same reason: throttling is the
# primary defence against online password guessing. Applied per-IP and
# per-account. Lower is safer; too low will annoy players on shared IPs.
# ---------------------------------------------------------------------------

LoginRateLimit = 10
LoginRateWindowSecs = 300
