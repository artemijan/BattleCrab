# ---------------------------------------------------------------------------
# Web Dashboard settings
#
# Every key here can be overridden by an environment variable — that is how
# secrets should be supplied in Docker/helm rather than being committed here.
# The variable name is derived from THIS FILE'S PATH, so the prefix is
# DIST_GAME_CONFIG_DASHBOARD_ followed by the uppercased key:
#
#   SessionSecret  ->  DIST_GAME_CONFIG_DASHBOARD_SESSIONSECRET
#   URL            ->  DIST_GAME_CONFIG_DASHBOARD_URL
#
# (Moving this file changes those variable names.)
#
# Design notes: docs/PLAN_DASHBOARD.md
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------

BindAddress = 0.0.0.0
Port = 8080

# Public origin the site is reached on. Used to build the links sent in emails,
# and — importantly — session cookies are only marked `Secure` when this is
# https://. Always set this to the real https URL in production.
PublicBaseUrl = http://localhost:8080

# Where the SPA is served from. Password-reset and email-verification links are
# built against this, because those are FRONTEND routes — pointing them at the
# API host hands the user a URL with no page behind it.
#
#   Production: https://battlecrab.com

SiteBaseUrl = http://localhost:3000

# Browser origins allowed to call this API with credentials (comma-separated).
#
# The API is on its own subdomain (api.battlecrab.com), so every request from
# the site is cross-origin and CORS applies. Each entry must be an exact origin
# — scheme + host + port, no trailing slash or path — because that is what the
# browser compares against.
#
# It is deliberately a list, never a wildcard: browsers reject
# `Allow-Origin: *` whenever credentials are sent, and accepting arbitrary
# origins would let any website drive a logged-in user's account.
#
#   Production: https://battlecrab.com,https://www.battlecrab.com
#
# Local dev needs nothing here — `bun run dev` proxies /api to this server, so
# the browser sees one origin.

AllowedOrigins = http://localhost:3000,http://127.0.0.1:3000

# ---------------------------------------------------------------------------
# Database
#
# MUST be the same SQLite file the login and game servers use — this is the
# integration point, and there is no sync layer. Pointing it at a stale copy
# will silently create accounts nobody can log in with.
#
# Copy the value from dist/login/config/LoginServer.ini verbatim.
# ---------------------------------------------------------------------------

URL = jdbc:sqlite:interlude_classic.db?journal_mode=WAL&busy_timeout=5000

MaximumDatabaseConnections = 5

# ---------------------------------------------------------------------------
# Sessions
#
# SessionSecret signs session cookies and the password-reset / email
# verification links. The server refuses to start when it is empty.
#
#   * Must be a long random string. Treat it like a password.
#   * Must stay stable across restarts — regenerating it logs every user out.
#   * Set it via CONFIG_DASHBOARD_SESSIONSECRET in production; do not commit it.
#
# Changing it is also the emergency "log everyone out" switch.
# ---------------------------------------------------------------------------

SessionSecret =

SessionTtlDays = 7

# ---------------------------------------------------------------------------
# Registration
# ---------------------------------------------------------------------------

RegistrationEnabled = True

# Passwords are stored with the game's own hash (unsalted SHA-1), which the
# client requires and we cannot change. Length is therefore the main defence if
# the table ever leaks — do not lower this.
MinPasswordLength = 8
MaxPasswordLength = 45

MaxLoginLength = 45

# ---------------------------------------------------------------------------
# Rate limiting
#
# Load-bearing rather than decorative, for the same reason: throttling is the
# primary defence against online password guessing. Applied per-IP and
# per-account. Lower is safer; too low will annoy players on shared IPs.
# ---------------------------------------------------------------------------

LoginRateLimit = 10
LoginRateWindowSecs = 300
