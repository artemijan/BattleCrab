<html noscrollbar>
<body>
<table width="700">
  <tr>
    <td height="10"></td>
  </tr>
</table>
<table width="20">
  <tr>
    <td>%navigation%</td>
    <td>
      <table
        border="0"
        cellpadding="0"
        cellspacing="0"
        width="555"
        height="455"
        background="L2UI_CT1.Windows_DF_TooltipBG"
      >
        <tr>
          <td height="25"></td>
        </tr>
        <tr>
          <td height="25" align="center">
            <font name="hs12" color="CDB67F">Adventurers' Buffer</font>
          </td>
        </tr>
        <tr>
          <td>
            <center>
              <img src="L2UI.SquareGray" width="200" height="1"/>
            </center>
          </td>
        </tr>
        <tr>
          <td width="100%">
            <center>
              <table>
                <tr>
                  <td>
                    <button
                      value="Buffs"
                      action="bypass _bbstop;buffer/main.html"
                      width="85"
                      height="26"
                      back="L2UI_CT1.Button_DF_Down"
                      fore="L2UI_CT1.Button_DF"
                    />
                  </td>
                  <td>
                    <button
                      value="Dances"
                      action="bypass _bbstop;buffer/dances.html"
                      width="85"
                      height="26"
                      back="L2UI_CT1.Button_DF_Down"
                      fore="L2UI_CT1.Button_DF"
                    />
                  </td>
                  <td>
                    <button
                      value="Songs"
                      action="bypass _bbstop;buffer/songs.html"
                      width="85"
                      height="26"
                      back="L2UI_CT1.Button_DF_Down"
                      fore="L2UI_CT1.Button_DF"
                    />
                  </td>
                  <td>
                    <button
                      value="Special"
                      action="bypass _bbstop;buffer/special.html"
                      width="85"
                      height="26"
                      back="L2UI_CT1.Button_DF_Down"
                      fore="L2UI_CT1.Button_DF"
                    />
                  </td>
                  <td>
                    <button
                      value="Schemes"
                      action="bypass _bbstop;buffer/schemes.html"
                      width="85"
                      height="26"
                      back="L2UI_CT1.Button_DF_Down"
                      fore="L2UI_CT1.Button_DF"
                    />
                  </td>
                </tr>
              </table>
            </center>
          </td>
        </tr>
        <tr>
          <td>
            <center>
              <img src="L2UI.SquareGray" width="500" height="1"/>
            </center>
          </td>
        </tr>
        <tr>
          <td height="25"></td>
        </tr>
        <tr>
          <td align="center" width="600">
            <table align="center" border="0" width="100%">
              <tr>
                <td align="center">
                  %schemenames%
                </td>
              </tr>
              <tr>
                <td height="40"></td>
              </tr>
              <tr>
                <td align="center" width="100%">
                  <edit var="name" width=140 height=15 />
                    <br/>
                    <button value="Create" action="bypass _bbs_buff_scheme_create $name buffer/schemes.html" width="88"
                            height="26"
                            back="L2UI_CT1.Button_DF_Down"
                            fore="L2UI_CT1.Button_DF"/>
                </td>
              </tr>
              <tr>
                <td align="center" width="80%">%errorMessage%</td>
              </tr>
              <tr>
                <td height="40"></td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
      <table border="0" cellpadding="0" cellspacing="0" width="555">
        <tr>
          <td height="10"></td>
        </tr>
      </table>
      <table
        border="0"
        cellpadding="0"
        cellspacing="0"
        width="555"
        background="L2UI_CT1.Windows_DF_TooltipBG"
      >
        <tr>
          <td height="17"></td>
        </tr>
        <tr>
          <td align="center">
            <font color="696969">LINEAGE II - COMMUNITY BOARD</font>
          </td>
        </tr>
        <tr>
          <td height="15"></td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
