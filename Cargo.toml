[workspace]
resolver = "2"
members = [
    "crates/commons",
    "crates/models",
    "crates/migration",
    "crates/loginserver",
    "crates/gameserver",
    "crates/launcher",
    "crates/dashboard_api",
    "crates/tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "io-util"] }
bytes = "1"
# Pinned to the version SeaORM 2 links: the two must agree or `SqlitePool`
# from `commons::db` and the one inside a `DatabaseConnection` become different
# types (docs/PLAN_ORM_MIGRATION.md §2). Raw sqlx survives only until the last
# hand-written query is ported.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
# The ORM. `default-features = false` drops the chrono/uuid/decimal value types
# the schema does not use — every column here is an integer, real or text.
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio",
] }
blowfish = "0.10.0"
byteorder = "1"
cipher = "0.5.2"
sha1 = "0.11.0"
base64 = "0.23.0"
num-bigint-dig = { version = "0.8", features = ["rand"] }
rsa = "0.9"
num-traits = "0.2"
rand = "0.8"
rand_distr = "0.4"
bevy_ecs = "0.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
quick-xml = "0.37"
if-addrs = "0.13"
memmap2 = "0.9"

# RSA keygen (LoginController's 10 client pairs + 10 GS-link pairs at boot)
# runs 30-100x slower without optimizations — keep the bigint math crates
# optimized even in dev builds so the login server boots fast.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# Grandfathered clippy lints: every entry below was already violated when the
# linter gate was introduced (2026-07-23), in game code where the churn of
# fixing them wholesale wasn't worth the review risk. The pre-commit hook runs
# `clippy -D warnings`, so anything NOT in this list is enforced. Burn entries
# down over time: delete one, fix what surfaces, commit both together.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
doc_lazy_continuation = "allow"
field_reassign_with_default = "allow"
large_enum_variant = "allow"
should_implement_trait = "allow"
if_same_then_else = "allow"
while_let_loop = "allow"
question_mark = "allow"
explicit_counter_loop = "allow"
assertions_on_constants = "allow"
drop_non_drop = "allow"
unnecessary_sort_by = "allow"
unnecessary_get_then_check = "allow"
# Quest scripts mirror Java's switch-case cond lists (`2 | 3 | 4`) and nested
# match shapes on purpose — the parity with the Java source must stay greppable.
manual_range_patterns = "allow"
collapsible_match = "allow"
