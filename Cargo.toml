[workspace]
resolver = "2"
members = [
    "crates/commons",
    "crates/models",
    "crates/migration",
    "crates/loginserver",
    "crates/gameserver",
    "crates/launcher",
    "crates/dashboard_api",
    "crates/tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "io-util"] }
bytes = "1"
# FxHash for the hot integer-keyed maps (object-id → entity/session/region).
# These are internal ids, not attacker-controlled keys, so SipHash's DoS
# resistance buys nothing there and costs on every broadcast recipient lookup.
rustc-hash = "2"
# Pinned to the version SeaORM 2 links: the two must agree or `SqlitePool`
# from `commons::db` and the one inside a `DatabaseConnection` become different
# types (docs/PLAN_ORM_MIGRATION.md §2). Raw sqlx survives only until the last
# hand-written query is ported.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
# The ORM. `default-features = false` drops the chrono/uuid/decimal value types
# the schema does not use — every column here is an integer, real or text.
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio",
] }
blowfish = "0.10.0"
byteorder = "1"
cipher = "0.5.2"
sha1 = "0.11.0"
base64 = "0.23.0"
num-bigint-dig = { version = "0.8", features = ["rand"] }
rsa = "0.9"
num-traits = "0.2"
rand = "0.8"
# Java `Say2.checkText` applies each `chatfilter.txt` line as a case-insensitive
# regex, so the filter needs a real regex engine to stay faithful.
regex = "1"
rand_distr = "0.4"
# `std` only: the game thread is the single owner of the ECS world, so the
# parallel executor (`async_executor`), reflection and backtrace machinery in
# the default set are dead weight here (THREADING_MODEL §7).
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Rotating file appender + the non-blocking writer. The game thread must never
# pay a `write(2)` for a log line: `non_blocking` hands the formatted line to a
# bounded channel drained by a dedicated thread, and in lossy mode drops on a
# full channel rather than blocking the caller — logging degrades under load
# instead of stealing tick budget.
tracing-appender = "0.2"
serde_json = "1"
# Only for the RFC3339 stamp on audit records. Already in the tree via the
# sqlx/sea-orm side, so this is a direct dependency on something that was
# being compiled anyway.
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
quick-xml = "0.37"
if-addrs = "0.13"
memmap2 = "0.9"
# Replaces the system allocator in the game server. The game thread is
# allocation-heavy and single-threaded, which is exactly mimalloc's shape.
mimalloc = "0.1"

# Cargo's default release profile is `codegen-units = 16`, which blocks
# cross-crate inlining between the 16 partitions of each crate. Benchmarked
# 2026-08-02: cgu=1 is a 20.6% binary-size win on the gameserver and LTO adds
# essentially nothing on top of it (thin LTO measured 5 KB *larger*, i.e.
# noise; fat LTO another 2 points for another 20 s). The cost is roughly 2x
# build time, paid only by `deploy.sh`.
#
# `panic = "abort"` must NEVER go here: `game_loop/net.rs` wraps every packet
# dispatch in `catch_unwind` (a port of Java's per-packet `Throwable` catch),
# and 29 `tokio::spawn` sites rely on unwind isolation. Under abort one
# malformed packet would take the server down instead of one client.
[profile.release]
codegen-units = 1

# Test-suite speed. The dist datapack is real XML — 19 MB of skill definitions
# alone — and ~230 tests parse some of it. nextest runs each test in its own
# process, so nothing is shared: every one of those tests pays the parse again.
#
# Unoptimized, that parse is ~12 s; at opt-level 2 it is ~1.4 s, and the whole
# suite goes from 126 s to 14 s. Measured 2026-08-04, and the split matters:
# optimizing only the dependencies (quick-xml) buys 12.2 s → 10.7 s, because
# the cost is in *our* parsing code, not the XML reader. Optimizing only the
# workspace crates gives 2.9 s. Both together give 1.4 s.
#
# opt-level 1 was measured too and is strictly worse than 2 here: the same
# clean-build cost (51.8 s vs 53.6 s) for a slower suite.
#
# The bill is a clean rebuild of `gameserver`: 24 s → 54 s. Incremental
# rebuilds are unchanged (~7-8 s), so touch-a-file-and-test round trips get
# *faster* overall (20.4 s → 8.8 s). `debug-assertions` stays on — the dev
# profile's default is independent of opt-level — so the debug-only invariant
# checks (`World::debug_check_player_regions`) still run.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.gameserver]
opt-level = 2

[profile.dev.package.commons]
opt-level = 2

# RSA keygen (LoginController's 10 client pairs + 10 GS-link pairs at boot)
# runs 30-100x slower without optimizations — keep the bigint math crates
# optimized even in dev builds so the login server boots fast.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# Grandfathered clippy lints: every entry below was already violated when the
# linter gate was introduced (2026-07-23), in game code where the churn of
# fixing them wholesale wasn't worth the review risk. The pre-commit hook runs
# `clippy -D warnings`, so anything NOT in this list is enforced. Burn entries
# down over time: delete one, fix what surfaces, commit both together.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
doc_lazy_continuation = "allow"
field_reassign_with_default = "allow"
large_enum_variant = "allow"
should_implement_trait = "allow"
if_same_then_else = "allow"
while_let_loop = "allow"
question_mark = "allow"
explicit_counter_loop = "allow"
assertions_on_constants = "allow"
drop_non_drop = "allow"
unnecessary_sort_by = "allow"
unnecessary_get_then_check = "allow"
# Quest scripts mirror Java's switch-case cond lists (`2 | 3 | 4`) and nested
# match shapes on purpose — the parity with the Java source must stay greppable.
manual_range_patterns = "allow"
collapsible_match = "allow"
