[workspace]
resolver = "2"
members = [
    "crates/commons",
    "crates/loginserver",
    "crates/gameserver",
    "crates/launcher",
    "crates/dashboard_api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "io-util"] }
bytes = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
blowfish = "0.9"
byteorder = "1"
cipher = "0.4"
sha1 = "0.10"
base64 = "0.22"
num-bigint-dig = { version = "0.8", features = ["rand"] }
rsa = "0.9"
num-traits = "0.2"
rand = "0.8"
bevy_ecs = "0.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
quick-xml = "0.37"
if-addrs = "0.13"
memmap2 = "0.9"

# RSA keygen (LoginController's 10 client pairs + 10 GS-link pairs at boot)
# runs 30-100x slower without optimizations — keep the bigint math crates
# optimized even in dev builds so the login server boots fast.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# Grandfathered clippy lints: every entry below was already violated when the
# linter gate was introduced (2026-07-23), in game code where the churn of
# fixing them wholesale wasn't worth the review risk. The pre-commit hook runs
# `clippy -D warnings`, so anything NOT in this list is enforced. Burn entries
# down over time: delete one, fix what surfaces, commit both together.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
doc_lazy_continuation = "allow"
field_reassign_with_default = "allow"
large_enum_variant = "allow"
should_implement_trait = "allow"
if_same_then_else = "allow"
while_let_loop = "allow"
question_mark = "allow"
explicit_counter_loop = "allow"
assertions_on_constants = "allow"
drop_non_drop = "allow"
unnecessary_sort_by = "allow"
unnecessary_get_then_check = "allow"
