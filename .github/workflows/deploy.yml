# CI/CD: every push to main goes build -> test -> deploy; pull requests run
# build + test only.
#
# The deploy job needs a GitHub Environment named "production" carrying the
# deploy.env variables (see deploy.env.example) as individual secrets and/or
# variables, NAMED EXACTLY as they appear in that file — each one is looked up
# in vars first, then secrets, and written into a deploy.env on the runner.
# Plus one extra secret that is not a deploy.env variable:
#
#   DEPLOY_SSH_KEY   Private key (OpenSSH PEM, the whole file including the
#                    BEGIN/END lines) authorized for REMOTE_USER@REMOTE_HOST.
#
# The deploy scripts are the same ones used for manual deploys from a
# workstation; CI only reconstructs deploy.env and the SSH key, then runs them.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Caches compiled dependencies (not workspace crates) keyed on
      # Cargo.lock; cache-on-failure keeps the warm cache even when tests fail,
      # so a fix-up push doesn't recompile the world.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo nextest run --workspace --locked --profile ci

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/dashboard/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Dashboard SPA typecheck
        working-directory: web/dashboard
        run: |
          bun install --frozen-lockfile
          bun run typecheck

  deploy:
    name: Deploy
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://battlecrab.com
    # Never run two deploys at once; a queued newer deploy supersedes waiting on
    # an older queued one, but an in-flight deploy is never cancelled mid-rsync.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Materialize deploy.env and SSH key
        # Non-secret values may live as environment *variables* (visible in
        # logs), secrets as environment *secrets* (masked); each name checks
        # vars first, then secrets, so either placement works.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ vars.REMOTE_HOST || secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER || secrets.REMOTE_USER }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH || secrets.REMOTE_PATH }}
          SSH_PORT: ${{ vars.SSH_PORT || secrets.SSH_PORT }}
          TARGET_TRIPLE: ${{ vars.TARGET_TRIPLE || secrets.TARGET_TRIPLE }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY || secrets.TURNSTILE_SITE_KEY }}
          DASHBOARD_TURNSTILE_SECRET: ${{ secrets.DASHBOARD_TURNSTILE_SECRET }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
          DASHBOARD_SMTP_HOST: ${{ vars.DASHBOARD_SMTP_HOST || secrets.DASHBOARD_SMTP_HOST }}
          DASHBOARD_SMTP_USERNAME: ${{ vars.DASHBOARD_SMTP_USERNAME || secrets.DASHBOARD_SMTP_USERNAME }}
          DASHBOARD_SMTP_PASSWORD: ${{ secrets.DASHBOARD_SMTP_PASSWORD }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Fail fast, by name, on anything the deploy scripts hard-require.
          for required in DEPLOY_SSH_KEY REMOTE_HOST REMOTE_USER REMOTE_PATH \
                          DASHBOARD_SESSION_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!required}" ]]; then
              echo "::error::$required is not set on the 'production' environment" \
                   "(as a variable or secret). See deploy.env.example."
              exit 1
            fi
          done
          # Assemble deploy.env for the deploy scripts to source, skipping
          # unset optionals. Values are single-quoted so nothing is
          # word-split or glob-expanded when sourced.
          : > deploy.env
          chmod 600 deploy.env
          for v in REMOTE_HOST REMOTE_USER REMOTE_PATH SSH_PORT TARGET_TRIPLE \
                   TURNSTILE_SITE_KEY DASHBOARD_TURNSTILE_SECRET \
                   DASHBOARD_SESSION_SECRET DASHBOARD_SMTP_HOST \
                   DASHBOARD_SMTP_USERNAME DASHBOARD_SMTP_PASSWORD \
                   CLOUDFLARE_TUNNEL_TOKEN CLOUDFLARE_API_TOKEN \
                   CLOUDFLARE_ACCOUNT_ID; do
            if [[ "${!v}" == *"'"* ]]; then
              echo "::error::$v contains a single quote, which the env-file writer cannot escape."
              exit 1
            fi
            if [[ -n "${!v}" ]]; then
              printf "%s='%s'\n" "$v" "${!v}" >> deploy.env
            fi
          done
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key so the first ssh call cannot be MITM'd or stall on
          # an interactive prompt. Retried, because a single scan can drop on
          # runner egress hiccups — and under `bash -e` that used to fail the
          # whole step with no message at all.
          for attempt in 1 2 3; do
            ssh-keyscan -T 10 -p "${SSH_PORT:-22}" -H "$REMOTE_HOST" > /tmp/hostkeys || true
            [[ -s /tmp/hostkeys ]] && break
            echo "ssh-keyscan attempt $attempt got no keys, retrying in 5s..."
            sleep 5
          done
          if [[ ! -s /tmp/hostkeys ]]; then
            echo "::error::ssh-keyscan got no host keys from $REMOTE_HOST:${SSH_PORT:-22}" \
                 "after 3 attempts — check that the server's firewall allows SSH" \
                 "from GitHub-hosted runner IPs, not just your own."
            exit 1
          fi
          cat /tmp/hostkeys >> ~/.ssh/known_hosts

      # Separate cache from build-test (rust-cache keys on the job id): this
      # job compiles release artifacts for the zigbuild cross target, which
      # would only pollute the test job's debug cache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/dashboard/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The ziglang wheel is ~50MB; keep pip's download cache warm.
      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-cargo-zigbuild-${{ runner.os }}

      - name: Install cargo-zigbuild (bundles zig)
        # The PyPI package ships the cargo-zigbuild binary and pulls in the
        # ziglang wheel, which cargo-zigbuild finds on its own — no system zig
        # needed. ~/.local/bin is already on PATH on GitHub runners.
        run: |
          pip3 install --user cargo-zigbuild \
            || pip3 install --user --break-system-packages cargo-zigbuild
          # Sanity check: the subcommand rejects --version, so probe with --help.
          command -v cargo-zigbuild
          cargo zigbuild --help > /dev/null

      - name: Add Rust target
        run: |
          source deploy.env
          rustup target add "${TARGET_TRIPLE:-x86_64-unknown-linux-gnu}"

      - name: Deploy login + game servers
        run: ./deploy.sh

      - name: Deploy dashboard API
        run: ./deploy-dashboard.sh

      - name: Deploy web frontend
        run: ./deploy-web.sh
