# cargo-nextest configuration (https://nexte.st).
#
# Run the suite with:  cargo nextest run
# nextest runs every test in its own process with real parallelism, which both
# speeds the suite up and isolates tests from each other's global state — the
# gameserver suite historically hung when run in-process via `cargo test`.

[profile.default]
# The suite is unit-heavy and fast; a test past 60s is almost certainly wedged.
# Warn at 60s and terminate it after a second period, so one deadlocked test is
# reported as a TIMEOUT failure instead of hanging the whole run.
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = false
# Print failing tests' output as they fail, plus a final recap.
failure-output = "immediate-final"

[profile.ci]
# CI: don't stop at the first failure, retry flakes, be a little more patient on
# slow machines, and emit a JUnit report for the runner to ingest.
retries = 2
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 3 }
failure-output = "immediate-final"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"
