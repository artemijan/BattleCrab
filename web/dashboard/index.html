<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BattleCrab — custom Lineage II Interlude Classic server</title>
    <meta
      name="description"
      content="BattleCrab is a custom Lineage II server built on Interlude Classic and written from scratch in Rust. Now in early alpha and open to everyone — create your account and play."
    />
    <!--
      Link previews.

      The phase named in these descriptions is duplicated from src/lib/status.ts,
      which this file cannot import. tests/link-preview.test.ts fails if they
      drift apart.

      og:image MUST be an absolute URL — crawlers do not resolve a relative path
      the way a browser does, and a relative one is the usual reason a card
      renders with no picture. The host is hardcoded rather than built from the
      current origin because these tags are read by bots that never run JS.

      og-image.jpg is copied verbatim by build.ts, deliberately unhashed: a
      content-hashed name would change on every rebuild and invalidate the URL
      already cached by every platform that has scraped it.
    -->
    <meta property="og:title" content="BattleCrab — custom Lineage II Interlude Classic server" />
    <meta
      property="og:description"
      content="BattleCrab is a custom Lineage II server built on Interlude Classic and written from scratch in Rust. Now in early alpha and open to everyone — create your account and play."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BattleCrab" />
    <meta property="og:url" content="https://battlecrab.com/" />
    <meta property="og:image" content="https://battlecrab.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="BattleCrab — the world of Lineage II, made our own. A custom server written from scratch in Rust."
    />

    <!-- Twitter reads og:* for everything except the card type, and without
         this it renders a small square thumbnail instead of the wide card. -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#0057b7" />

    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />

    <script>
      // Applied before first paint so a dark-theme visitor never sees a white
      // flash. Mirrors the logic in src/lib/theme.tsx — keep the two in sync.
      (function () {
        try {
          var stored = localStorage.getItem("bc-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
