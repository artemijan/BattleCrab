<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BattleCrab — Lineage II Interlude</title>
    <meta
      name="description"
      content="Play Lineage II Interlude on BattleCrab. Create your account, manage your characters, and join the world."
    />
    <meta property="og:title" content="BattleCrab — Lineage II Interlude" />
    <meta
      property="og:description"
      content="Play Lineage II Interlude on BattleCrab. Create your account, manage your characters, and join the world."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0057b7" />

    <script>
      // Applied before first paint so a dark-theme visitor never sees a white
      // flash. Mirrors the logic in src/lib/theme.tsx — keep the two in sync.
      (function () {
        try {
          var stored = localStorage.getItem("bc-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
