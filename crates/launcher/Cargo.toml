[package]
name = "launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BattleCrab game client launcher and updater"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.35.0"
egui = "0.35.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Pinned to 0.12, not 0.13, specifically to get `native-tls` — which on Windows is
# SChannel, the OS's own TLS stack.
#
# 0.13's rustls path drags in aws-lc-rs, which needs CMake and NASM to build and so
# blocks a Windows build entirely, cross-compiled or not. 0.13 cannot use native-tls
# either: it pins `native-tls ^0.2.16`, unpublished (crates.io stops at 0.2.14). 0.12
# has no such pin. SChannel also leaves zero C dependencies in the tree, which is
# what makes cross-compiling from macOS viable at all.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "http2", "charset", "native-tls"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tracing.workspace = true
tracing-subscriber.workspace = true
zstd = "0.13.3"

[dev-dependencies]
egui_kittest = { version = "0.35.0", features = ["wgpu", "snapshot"] }
