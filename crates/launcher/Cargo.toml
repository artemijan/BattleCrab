[package]
name = "launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BattleCrab game client launcher and updater"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.35.0"
egui = "0.35.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# TLS is rustls, which drags in aws-lc-rs — that needs CMake and NASM on the Windows
# build machine. SChannel via `native-tls` would avoid both, but reqwest 0.13.4 pins
# `native-tls ^0.2.16`, which is not published (crates.io stops at 0.2.14), so that
# route is closed until it is. If the Windows toolchain proves painful, the escape
# hatch is `rustls-no-provider` plus the `ring` provider installed in main().
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "http2", "charset", "rustls"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tracing.workspace = true
tracing-subscriber.workspace = true
zstd = "0.13.3"

[dev-dependencies]
egui_kittest = { version = "0.35.0", features = ["wgpu", "snapshot"] }
