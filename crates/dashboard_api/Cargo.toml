[package]
name = "dashboard_api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web dashboard REST API — account registration and management"

[dependencies]
commons = { path = "../commons" }
models = { path = "../models" }
tokio.workspace = true
sqlx.workspace = true
rand.workspace = true
tracing.workspace = true
thiserror.workspace = true
base64.workspace = true
# Item-catalog extraction from the datapack's generated XML (see `items`).
regex.workspace = true

axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["compression-gzip", "trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
# rustls, not native-tls: the deploy cross-compiles with cargo-zigbuild, and an
# OpenSSL dependency would need a cross-built C toolchain.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "hostname",
    "tokio1",
    "tokio1-rustls-tls",
    "ring",
    "webpki-roots",
] }
mime_guess = "2"

[dev-dependencies]
migration = { path = "../migration" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
