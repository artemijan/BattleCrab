[package]
name = "tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline datapack/geodata tools (l2r-tools CLI)"

[lib]
name = "tools"
path = "src/lib.rs"

[[bin]]
name = "l2r-tools"
path = "src/main.rs"

[dependencies]
# The whole point of these tools is to answer questions with the *server's*
# geo code rather than a reimplementation of it, so they link the game server
# and call `GeoEngine` directly.
commons = { path = "../commons" }
gameserver = { path = "../gameserver" }
clap = { version = "4", features = ["derive"] }
# `client-dat`: raw RSA over the client's 128-byte blocks, the zlib stream they
# wrap, the CRC32 in its footer, and the manifest that records which cipher
# each file used. All of these are already in the workspace's dependency graph.
num-bigint-dig.workspace = true
flate2 = "1"
crc32fast = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
quick-xml.workspace = true
regex = "1"
ratatui = "0.30.2"

[lints]
workspace = true
