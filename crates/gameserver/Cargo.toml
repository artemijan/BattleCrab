[package]
name = "gameserver"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
commons = { path = "../commons" }
models = { path = "../models" }
rand.workspace = true
tokio.workspace = true
bytes.workspace = true
bevy_ecs.workspace = true
tracing.workspace = true
# Audit records are NDJSON, built at the call site with `json!`.
serde_json.workspace = true
# The datapack snapshot cache (`data::snapshot`) and the derives it needs.
serde.workspace = true
bincode.workspace = true
thiserror.workspace = true
quick-xml.workspace = true
regex.workspace = true
if-addrs.workspace = true
memmap2.workspace = true
mimalloc.workspace = true
rustc-hash.workspace = true
enum-ordinalize.workspace = true

[dev-dependencies]
# Tests still assert with SQL and build fixtures; the crate itself no longer
# speaks it — every statement goes through `models`.
sqlx.workspace = true
commons = { path = "../commons" }
loginserver = { path = "../loginserver" }
migration = { path = "../migration" }
models = { path = "../models" }
num-bigint-dig.workspace = true
criterion = "0.5"

[features]
# Exposes `game_loop::bench_api` (world builder + tick-system wrappers) to
# the `tick` bench. Never enabled by normal builds.
bench-api = []

[[bench]]
name = "geo"
harness = false

[[bench]]
name = "tick"
harness = false
required-features = ["bench-api"]

[lints]
workspace = true
